<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Moderní Web – Úvod</title>
<link rel="stylesheet" href="style.css" />
<script>
function setLang(l){localStorage.setItem('lang',l);location.reload();}
window.onload=()=>{let l=localStorage.getItem('lang')||'cs';document.querySelectorAll('[data-cs]').forEach(el=>{el.innerHTML=el.getAttribute('data-'+l);});};
</script>
</head>
<body>
<header>
<nav class="navbar">
<a href="index.html" class="logo">ModernWeb</a>
<ul>
<li><a href="index.html">Domů</a></li>
<li><a href="o-nas.html">O nás</a></li>
<li><a href="kontakt.html">Kontakt</a></li>
</ul>
<div class="lang-switch"><button onclick="setLang('cs')">CZ</button><button onclick="setLang('en')">EN</button></div>
</nav>
</header>


<section class="hero" style="background: url('https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=1600&q=80') center/cover no-repeat;">
<div class="hero-overlay">
<h1 data-cs="Objevujte svět s TravelVision" data-en="TravelVision"></h1>
<p>Cestovní agentura, která vás vezme tam, kam srdce chce.</p>
</div>
</section>
</body>
</html>
